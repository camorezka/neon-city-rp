<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON CITY RP — 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Segoe UI,Arial,sans-serif}canvas{display:block}
#loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#111827,#020409 70%);transition:.35s}.loaderBox{width:min(460px,90vw);padding:28px;border:1px solid #263246;border-radius:18px;background:rgba(7,11,20,.9);box-shadow:0 20px 80px #000}.logo{font-size:28px;letter-spacing:5px;font-weight:800;color:#67e8f9;margin-bottom:20px}.bar{height:7px;background:#182132;border-radius:9px;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#8b5cf6);transition:width:.2s}#status{margin-top:12px;color:#94a3b8;font-size:13px;min-height:20px}#err{display:none;margin-top:14px;padding:10px;border-radius:10px;background:#3a1118;color:#fecaca;font-size:12px;line-height:1.5}
#hud{display:none;position:fixed;inset:0;z-index:10;pointer-events:none}#help{position:absolute;left:18px;top:18px;padding:11px 14px;border:1px solid #253047;background:rgba(4,8,15,.68);backdrop-filter:blur(8px);border-radius:12px;color:#9aa8bc;font-size:12px;line-height:1.7}#help b{color:#e5e7eb}#prompt{display:none;position:absolute;left:50%;bottom:58px;transform:translateX(-50%);padding:11px 18px;border:1px solid rgba(34,211,238,.35);background:rgba(4,8,15,.78);border-radius:12px;backdrop-filter:blur(10px);font-size:13px}#prompt kbd{padding:2px 7px;margin-right:5px;border-radius:5px;background:#12303a;color:#67e8f9}#speed{display:none;position:absolute;right:25px;bottom:25px;text-align:right}#speedN{font-size:58px;line-height:.9;font-weight:800;text-shadow:0 0 22px rgba(34,211,238,.35)}#speedU{font-size:11px;letter-spacing:4px;color:#67e8f9;margin-top:5px}#modelState{position:absolute;right:18px;top:18px;padding:9px 12px;border-radius:10px;background:rgba(4,8,15,.65);border:1px solid #253047;color:#8fa0b8;font-size:11px}#modelState .ok{color:#86efac}#modelState .bad{color:#fda4af}
</style>
</head>
<body>
<div id="loader"><div class="loaderBox"><div class="logo">NEON CITY RP</div><div class="bar"><div id="bar"></div></div><div id="status">Запуск города…</div><div id="err"></div></div></div>
<div id="hud"><div id="help"><b>КЛИК</b> — мышь<br><b>WASD</b> — ходьба / машина<br><b>SHIFT</b> — бег<br><b>SPACE</b> — прыжок<br><b>E</b> — сесть / выйти</div><div id="prompt"><kbd>E</kbd><span id="promptText">Сесть в Ferrari</span></div><div id="speed"><div id="speedN">0</div><div id="speedU">KM/H</div></div><div id="modelState">Модели: <span id="charState">…</span> · <span id="carState">…</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{'use strict';
const ASSETS={character:['https://cdn.jsdelivr.net/gh/NafisRayan/Animate-Rigged-Humanoid-No-Blender@main/test/human_male.glb','https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/main/test/human_male.glb','./models/human_male.glb'],car:['https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/ferrari.glb','https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/ferrari.glb','./models/ferrari.glb']};
const $=id=>document.getElementById(id);let scene,camera,renderer,clock,playerGroup,playerModel,mixer,carGroup,carWheels=[],frontWheels=[],actions={},activeAction=null,activeName='',keys=Object.create(null),inCar=false,pointerLocked=false,yaw=0,pitch=-.14,verticalVelocity=0,grounded=true,landTimer=0,moveVelocity=new THREE.Vector3(),carSpeed=0,carSteer=0;const colliders=[],up=new THREE.Vector3(0,1,0);
function setStatus(t,p){$('status').textContent=t;$('bar').style.width=Math.max(0,Math.min(100,p||0))+'%'}function showModelState(id,text,ok){const el=$(id);el.textContent=text;el.className=ok?'ok':'bad'}function finishLoader(){setTimeout(()=>{$('loader').classList.add('off');$('hud').style.display='block'},350)}function failBox(text){$('err').style.display='block';$('err').textContent=text}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x070b13);scene.fog=new THREE.FogExp2(0x070b13,.0065);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.08,1200);camera.position.set(0,2.2,15);clock=new THREE.Clock();renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.appendChild(renderer.domElement);addLights();buildCity();bindEvents();loadAllModels();animate()}
function addLights(){scene.add(new THREE.HemisphereLight(0x9ec5ff,0x151827,1.05));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-45,75,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);const cyan=new THREE.PointLight(0x22d3ee,80,80,2);cyan.position.set(0,8,8);scene.add(cyan);const purple=new THREE.PointLight(0x8b5cf6,70,70,2);purple.position.set(-35,8,-35);scene.add(purple)}
function buildCity(){const roadMat=new THREE.MeshStandardMaterial({color:0x101722,roughness:.9,metalness:.05});const ground=new THREE.Mesh(new THREE.PlaneGeometry(360,360),roadMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);for(let i=-2;i<=2;i++){const road=new THREE.Mesh(new THREE.PlaneGeometry(12,360),roadMat);road.rotation.x=-Math.PI/2;road.position.x=i*32;road.position.y=.012;scene.add(road);const road2=new THREE.Mesh(new THREE.PlaneGeometry(360,12),roadMat);road2.rotation.x=-Math.PI/2;road2.position.z=i*32;road2.position.y=.013;scene.add(road2)}for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){if(Math.abs(x)<=1&&Math.abs(z)<=1)continue;if(Math.random()<.16)continue;const w=14+Math.random()*7,d=14+Math.random()*7,h=12+Math.random()*44,bx=x*32+(Math.random()-.5)*7,bz=z*32+(Math.random()-.5)*7;const mat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.62+Math.random()*.09,.25,.10+.07*Math.random()),roughness:.58,metalness:.18});const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);b.position.set(bx,h/2,bz);b.castShadow=true;b.receiveShadow=true;scene.add(b);colliders.push({minX:bx-w/2-1,maxX:bx+w/2+1,minZ:bz-d/2-1,maxZ:bz+d/2+1});for(let side=0;side<2;side++){const strip=new THREE.Mesh(new THREE.BoxGeometry(side?.08:w*.72,Math.max(1,h*.82),.06),new THREE.MeshBasicMaterial({color:side?0x8b5cf6:0x22d3ee}));strip.position.set(bx+(side?0:w*.18),h*.53,bz-d/2-.035);scene.add(strip)}}const poleMat=new THREE.MeshStandardMaterial({color:0x334155,metalness:.8,roughness:.35}),lampMat=new THREE.MeshBasicMaterial({color:0x67e8f9});for(let i=-5;i<=5;i++)for(let z=-5;z<=5;z++){if((i+z)%2)continue;const g=new THREE.Group(),pole=new THREE.Mesh(new THREE.CylinderGeometry(.055,.08,4.5,8),poleMat);pole.position.y=2.25;g.add(pole);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),lampMat);lamp.position.y=4.5;g.add(lamp);g.position.set(i*32+6,0,z*32+6);scene.add(g)}}
function loadGLB(url,timeout=9000){return new Promise((resolve,reject)=>{const l=new THREE.GLTFLoader();let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(new Error('timeout: '+url))}},timeout);l.load(url,g=>{if(settled)return;settled=true;clearTimeout(timer);resolve(g)},undefined,e=>{if(settled)return;clearTimeout(timer);settled=true;reject(e||new Error('load error: '+url))})})}
async function loadAny(urls,label){let last=null;const jobs=urls.map((url,i)=>loadGLB(url).then(g=>({g,url,i})).catch(e=>{last=e;throw e}));try{const result=await Promise.any(jobs);return{g:result.g,source:result.i===urls.length-1?'LOCAL':'ONLINE',url:result.url}}catch(e){throw last||new Error('Не удалось загрузить '+label)} }
async function loadAllModels(){setStatus('Город готов. Загружаю персонажа и Ferrari параллельно…',12);const cp=loadAny(ASSETS.character,'персонажа'),vp=loadAny(ASSETS.car,'Ferrari 458');cp.then(({g,source})=>{setupCharacter(g);showModelState('charState',source,true);setStatus('Персонаж готов. Настраиваю анимации…',55)}).catch(e=>{showModelState('charState','ERROR',false);console.error('CHARACTER',e);failBox('Персонаж не загрузился: '+(e?.message||'unknown error'));});vp.then(({g,source})=>{setupCar(g);showModelState('carState',source,true);setStatus('Ferrari 458 готова.',100)}).catch(e=>{showModelState('carState','ERROR',false);console.error('FERRARI',e);failBox('Ferrari не загрузилась: '+(e?.message||'unknown error'));});setTimeout(finishLoader,1200)}
function normalizeModel(root,targetHeight){const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3());if(size.y>0)root.scale.multiplyScalar(targetHeight/size.y);root.updateMatrixWorld(true)}
function setupCharacter(gltf){if(playerGroup)scene.remove(playerGroup);playerGroup=new THREE.Group();playerModel=gltf.scene;normalizeModel(playerModel,1.82);playerModel.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material)o.material.envMapIntensity=.65}});playerGroup.add(playerModel);playerGroup.position.set(0,0,10);scene.add(playerGroup);mixer=new THREE.AnimationMixer(playerModel);actions={};gltf.animations.forEach(clip=>{const key=canonicalAnimName(clip.name);if(!actions[key])actions[key]=mixer.clipAction(clip)});const findClip=words=>{const clip=gltf.animations.find(c=>words.some(w=>c.name.toLowerCase().includes(w)));return clip?mixer.clipAction(clip):null};actions.Idle=actions.Idle||findClip(['idle','stand','breath']);actions.Walk=actions.Walk||findClip(['walk','walking','jog']);actions.Run=actions.Run||findClip(['run','sprint']);actions.Jump=actions.Jump||findClip(['jump']);actions.Fall=actions.Fall||findClip(['fall']);actions.Land=actions.Land||findClip(['land']);playAnim(actions.Idle?'Idle':'Walk',.01)}
function canonicalAnimName(name){const n=name.toLowerCase();if(n.includes('idle')||n.includes('stand')||n.includes('breath'))return'Idle';if(n.includes('walk')||n.includes('jog'))return'Walk';if(n.includes('run')||n.includes('sprint'))return'Run';if(n.includes('jump'))return'Jump';if(n.includes('fall'))return'Fall';if(n.includes('land'))return'Land';return name}
function playAnim(name,fade=.16){if(!actions[name]||activeAction===actions[name])return;const next=actions[name],old=activeAction;next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(fade).play();if(old)old.fadeOut(fade);activeAction=next;activeName=name}
function setupCar(gltf){if(carGroup)scene.remove(carGroup);carWheels=[];frontWheels=[];carGroup=gltf.scene;const box=new THREE.Box3().setFromObject(carGroup),size=box.getSize(new THREE.Vector3()),longest=Math.max(size.x,size.z);if(longest>0)carGroup.scale.multiplyScalar(4.65/longest);carGroup.position.set(7,0,4);carGroup.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;const n=o.name.toLowerCase();if(n.includes('wheel')||n.includes('tire')||n.includes('tyre'))carWheels.push(o);if(n.includes('front')&&(n.includes('wheel')||n.includes('tire')||n.includes('tyre')))frontWheels.push(o)});scene.add(carGroup)}
function bindEvents(){addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();if(e.code==='KeyE')toggleVehicle();if(e.code==='Space'&&!inCar)jump()});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>{if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===renderer.domElement});document.addEventListener('mousemove',e=>{if(!pointerLocked)return;yaw-=e.movementX*.0024;pitch-=e.movementY*.0018;pitch=Math.max(-.55,Math.min(.3,pitch))})}
function jump(){if(!playerGroup||!grounded)return;grounded=false;verticalVelocity=6.2;landTimer=0;playAnim('Jump',.08)}
function blocked(pos,r=.65){for(const c of colliders)if(pos.x>c.minX-r&&pos.x<c.maxX+r&&pos.z>c.minZ-r&&pos.z<c.maxZ+r)return true;return false}
function updatePlayer(dt){if(!playerGroup||!playerModel){updateCameraIdle(dt);return}if(inCar){updateCar(dt);return}const ix=(keys.KeyD?1:0)-(keys.KeyA?1:0),iz=(keys.KeyS?1:0)-(keys.KeyW?1:0),input=new THREE.Vector3(ix,0,iz);if(input.lengthSq()>1)input.normalize();const running=!!(keys.ShiftLeft||keys.ShiftRight),maxSpeed=running?7.2:3.65;input.applyAxisAngle(up,yaw);const accel=grounded?14:5;moveVelocity.lerp(input.clone().multiplyScalar(maxSpeed),1-Math.exp(-accel*dt));if(input.lengthSq()===0)moveVelocity.multiplyScalar(Math.exp(-10*dt));const next=playerGroup.position.clone().addScaledVector(moveVelocity,dt);if(!blocked(next,.55)){playerGroup.position.x=next.x;playerGroup.position.z=next.z}if(!grounded){verticalVelocity-=17*dt;playerGroup.position.y+=verticalVelocity*dt;if(verticalVelocity<0&&actions.Fall&&activeName!=='Fall')playAnim('Fall',.1);if(playerGroup.position.y<=0){playerGroup.position.y=0;verticalVelocity=0;grounded=true;landTimer=.18;if(actions.Land)playAnim('Land',.06)}}else if(landTimer>0){landTimer-=dt;if(landTimer<=0)updateLocomotionAnimation(input,running)}else updateLocomotionAnimation(input,running);if(input.lengthSq()>.001){const desired=Math.atan2(input.x,input.z);let d=desired-playerGroup.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));playerGroup.rotation.y+=d*(1-Math.exp(-13*dt))}if(grounded&&input.lengthSq()>.01){const t=performance.now()*.012*(running?1.55:1),bob=Math.sin(t)*.018;playerModel.position.y=bob;playerModel.scale.y=1+Math.sin(t*2)*.012}else if(playerModel){playerModel.position.y=THREE.MathUtils.lerp(playerModel.position.y,0,1-Math.exp(-8*dt));playerModel.scale.y=THREE.MathUtils.lerp(playerModel.scale.y,1,1-Math.exp(-8*dt))}if(mixer)mixer.update(dt);updatePlayerCamera(dt);updatePrompt()}
function updateLocomotionAnimation(input,running){if(input.lengthSq()<.001)playAnim('Idle');else playAnim(running?'Run':'Walk')}
function updatePlayerCamera(dt){const target=playerGroup.position.clone().add(new THREE.Vector3(0,1.25,0)),dist=4.5,desired=new THREE.Vector3(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y-Math.sin(pitch)*dist+.25,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.position.lerp(desired,1-Math.exp(-8*dt));camera.lookAt(target)}
function updateCameraIdle(dt){camera.position.lerp(new THREE.Vector3(0,3,16),1-Math.exp(-2*dt));camera.lookAt(0,1,0)}
function toggleVehicle(){if(!carGroup||!playerGroup)return;if(inCar){inCar=false;playerGroup.visible=true;const side=new THREE.Vector3(2.5,0,0).applyAxisAngle(up,carGroup.rotation.y);playerGroup.position.copy(carGroup.position).add(side);carSpeed=0;$('speed').style.display='none';return}if(playerGroup.position.distanceTo(carGroup.position)<4.5){inCar=true;playerGroup.visible=false;$('speed').style.display='block'}}
function updatePrompt(){if(!carGroup)return;const d=playerGroup.position.distanceTo(carGroup.position);$('prompt').style.display=d<4.5?'block':'none';$('promptText').textContent='Сесть в Ferrari 458'}
function updateCar(dt){let throttle=0;if(keys.KeyW)throttle=1;if(keys.KeyS)throttle=-.6;const maxSpeed=22;carSpeed+=throttle*28*dt;if(!throttle)carSpeed*=Math.exp(-2.4*dt);carSpeed=THREE.MathUtils.clamp(carSpeed,-9,maxSpeed);const steerInput=(keys.KeyA?1:0)-(keys.KeyD?1:0),steerTarget=steerInput*.48;carSteer=THREE.MathUtils.lerp(carSteer,steerTarget,1-Math.exp(-7*dt));if(Math.abs(carSpeed)>.15)carGroup.rotation.y+=carSteer*dt*(.55+Math.abs(carSpeed)/maxSpeed)*Math.sign(carSpeed);const forward=new THREE.Vector3(0,0,1).applyAxisAngle(up,carGroup.rotation.y),next=carGroup.position.clone().addScaledVector(forward,carSpeed*dt);if(!blocked(next,1.25))carGroup.position.copy(next);else carSpeed*=.2;carWheels.forEach(w=>w.rotation.x+=carSpeed*dt*2.5);frontWheels.forEach(w=>w.rotation.y=carSteer);const target=carGroup.position.clone().add(new THREE.Vector3(0,1.05,0)),dist=7.5,desired=new THREE.Vector3(target.x-Math.sin(carGroup.rotation.y)*dist,target.y+2.5,target.z-Math.cos(carGroup.rotation.y)*dist);camera.position.lerp(desired,1-Math.exp(-5*dt));camera.lookAt(target);$('speedN').textContent=Math.round(Math.abs(carSpeed)*3.6);$('prompt').style.display='block';$('promptText').textContent='Выйти из Ferrari'}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);updatePlayer(dt);renderer.render(scene,camera)}init();
})();
</script>
</body>
</html>
